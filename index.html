<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Attendance Pro</title>

<script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI;}

body{
  background:linear-gradient(135deg,#141e30,#243b55);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
}

.app{
  width:95%;
  max-width:420px;
  background:rgba(255,255,255,0.07);
  backdrop-filter:blur(12px);
  border-radius:25px;
  padding:20px;
  box-shadow:0 20px 40px rgba(0,0,0,0.5);
}

.header{text-align:center;margin-bottom:15px;}

.counter{
  background:linear-gradient(45deg,#00c6ff,#0072ff);
  padding:10px;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
  margin-bottom:15px;
}

video{
  width:100%;
  border-radius:15px;
}

.result{
  margin-top:15px;
  padding:12px;
  border-radius:12px;
  text-align:center;
  display:none;
  font-weight:bold;
}

.success{background:#00ffcc;color:#003333;}
.error{background:#ff4d4d;color:white;}

button{
  margin-top:10px;
  width:100%;
  padding:10px;
  border:none;
  border-radius:10px;
  background:linear-gradient(45deg,#f7971e,#ffd200);
  font-weight:bold;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
  <h2>QR Attendance Pro</h2>
</div>

<div class="counter">
  Present Today: <span id="presentCount">0</span>
</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" hidden></canvas>

<div id="result" class="result"></div>

<button onclick="openSheet()">View Attendance Sheet</button>

</div>

<script>

const scriptURL = "https://script.google.com/macros/s/AKfycbx23X1Mxc2X5nOSxoOxT835Y0iZ5jSZcE47cfdSkoZI8RbEE13W1feVq02FKkpxdwOv/exec";
const sheetURL  = "https://docs.google.com/spreadsheets/d/1s892prc1DYg6xOEJviowy7gx16r4K4q_Tho7K5L0N04/edit";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const resultBox = document.getElementById("result");
const counter = document.getElementById("presentCount");

let presentCount = 0;
let scanning = true;
let lastScan = "";

// 🔊 Beep Sound
function beep(){
  const audio = new Audio("https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg");
  audio.play();
}

// Start Camera (Fast Low Resolution)
navigator.mediaDevices.getUserMedia({
  video:{
    facingMode:"environment",
    width:{ideal:480},
    height:{ideal:360}
  }
})
.then(stream=>{
  video.srcObject = stream;
  requestAnimationFrame(scanQR);
})
.catch(()=>{
  showMessage("Camera Permission Denied ❌","error");
});

function showMessage(msg,type){
  resultBox.innerText = msg;
  resultBox.className = "result " + type;
  resultBox.style.display="block";
  setTimeout(()=>{resultBox.style.display="none";},1500);
}

function scanQR(){

  if(video.readyState === video.HAVE_ENOUGH_DATA && scanning){

    canvas.width = 320;
    canvas.height = 240;

    ctx.drawImage(video,0,0,320,240);

    const imageData = ctx.getImageData(0,0,320,240);
    const code = jsQR(imageData.data,320,240);

    if(code){

      const qrData = code.data;

      // prevent repeat scan within short time
      if(qrData === lastScan) return;

      lastScan = qrData;
      scanning = false;

      const parts = qrData.split(",");

      if(parts.length < 3){
        showMessage("Invalid QR ❌","error");
        scanning = true;
        return;
      }

      // Send to Apps Script
      fetch(scriptURL,{
        method:"POST",
        mode:"no-cors",
        body:JSON.stringify({
          serial:parts[0],
          name:parts[1],
          roll:parts[2]
        })
      });

      // UI Update (since no-cors won't return response)
      beep();
      presentCount++;
      counter.innerText = presentCount;
      showMessage("Attendance Sent ✅","success");

      setTimeout(()=>{
        scanning = true;
        lastScan = "";
      },1500);
    }
  }

  requestAnimationFrame(scanQR);
}

function openSheet(){
  window.open(sheetURL,"_blank");
}

</script>

</body>
</html>
