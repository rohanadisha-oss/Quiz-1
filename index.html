<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart QR Attendance</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/minified/html5-qrcode.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI;}

body{
  background:linear-gradient(135deg,#4e73df,#1cc88a);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.app{
  width:95%;
  max-width:420px;
  background:white;
  border-radius:25px;
  padding:20px;
  box-shadow:0 15px 35px rgba(0,0,0,0.3);
}

.header{
  text-align:center;
  margin-bottom:10px;
}

.header h2{
  color:#333;
}

.counter{
  background:#4e73df;
  color:white;
  padding:10px;
  border-radius:10px;
  margin:10px 0;
  text-align:center;
  font-weight:bold;
}

#reader{
  width:100%;
  margin-top:10px;
}

.result{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  font-weight:bold;
  display:none;
  text-align:center;
}

.success{
  background:#d4edda;
  color:#155724;
}

.error{
  background:#f8d7da;
  color:#721c24;
}

button{
  margin-top:15px;
  width:100%;
  padding:10px;
  border:none;
  border-radius:10px;
  background:#f6c23e;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
  <h2> Smart QR Attendance</h2>
</div>

<div class="counter">
  Present Today: <span id="presentCount">0</span>
</div>

<div id="reader"></div>

<div id="result" class="result"></div>

<button onclick="openSheet()"> View Attendance Sheet</button>

</div>

<script>

const scriptURL = "https://script.google.com/macros/s/AKfycbx23X1Mxc2X5nOSxoOxT835Y0iZ5jSZcE47cfdSkoZI8RbEE13W1feVq02FKkpxdwOv/exec";
const sheetURL = "https://docs.google.com/spreadsheets/d/1s892prc1DYg6xOEJviowy7gx16r4K4q_Tho7K5L0N04/edit?gid=0#gid=0";

let presentCount = 0;
let scanning = true;

const resultBox = document.getElementById("result");
const counter = document.getElementById("presentCount");

function showMessage(msg,type){
  resultBox.innerText = msg;
  resultBox.className = "result " + type;
  resultBox.style.display = "block";

  setTimeout(()=>{
    resultBox.style.display = "none";
  },2000);
}

function playBeep(){
  const audio = new Audio("https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg");
  audio.play();
}

function startScanner(){

  const html5QrCode = new Html5Qrcode("reader");

  Html5Qrcode.getCameras().then(devices => {

    if(devices.length > 0){

      const cameraId = devices[0].id;

      html5QrCode.start(
        cameraId,
        { fps:10, qrbox:250 },
        (decodedText)=>{

          if(!scanning) return;

          scanning = false;

          const parts = decodedText.split(",");

          if(parts.length < 3){
            showMessage("Invalid QR ❌","error");
            scanning = true;
            return;
          }

          const serial = parts[0];
          const name   = parts[1];
          const roll   = parts[2];

          fetch(scriptURL,{
            method:"POST",
            body:JSON.stringify({
              serial:serial,
              name:name,
              roll:roll
            })
          })
          .then(res=>res.text())
          .then(data=>{

            playBeep();

            if(data.includes("Marked")){
              presentCount++;
              counter.innerText = presentCount;
              showMessage(data,"success");
            }else{
              showMessage(data,"error");
            }

            setTimeout(()=>{
              scanning = true;
            },1500);

          })
          .catch(()=>{
            showMessage("Server Error ❌","error");
            scanning = true;
          });

        }
      );

    }else{
      showMessage("No Camera Found ❌","error");
    }

  }).catch(err=>{
    showMessage("Camera Permission Denied ❌","error");
  });

}

function openSheet(){
  window.open(sheetURL,"_blank");
}

window.onload = startScanner;

</script>

</body>
</html>
